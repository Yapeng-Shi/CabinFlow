syntax = "proto3";

package cabinflow.protocol.v1;

enum DeliveryErrorCode {
  DELIVERY_ERROR_UNSPECIFIED = 0;
  DELIVERY_ERROR_INVALID_ENVELOPE = 1;
  DELIVERY_ERROR_UNSUPPORTED_SCHEMA = 2;
  DELIVERY_ERROR_UNKNOWN_TARGET = 3;
  DELIVERY_ERROR_UNSUPPORTED_TOPIC = 4;
  DELIVERY_ERROR_INVALID_PAYLOAD = 5;
  DELIVERY_ERROR_DEADLINE_EXCEEDED = 6;
  DELIVERY_ERROR_QUEUE_FULL = 7;
  DELIVERY_ERROR_DUPLICATE_MESSAGE = 8;
  DELIVERY_ERROR_STALE_SEQUENCE = 9;
  DELIVERY_ERROR_STREAM_FINALIZED = 10;
  DELIVERY_ERROR_SESSION_CANCELLED = 11;
  DELIVERY_ERROR_WORK_CANCELLED = 12;
}

message DeliveryError {
  string request_message_id = 1;
  DeliveryErrorCode code = 2;
  string message = 3;
}
