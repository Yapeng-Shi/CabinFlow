syntax = "proto3";

package cabinflow.agent.v1;

message TextInput {
  string text = 1;
}

// 只表示识别出的音乐指令，不代表播放器已经执行或播放成功。
message MusicCommand {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    SEARCH = 1;
    PLAY = 2;
    PAUSE = 3;
    PREVIOUS = 4;
    NEXT = 5;
    SELECT = 6;
  }
  Action action = 1;
  string keyword = 2;
  uint32 result_index = 3; // 搜索结果的一基编号；只有 SELECT 使用。
}

enum CockpitIntent {
  COCKPIT_INTENT_UNRECOGNIZED = 0;
  COCKPIT_INTENT_CLIMATE_ON = 1;
  COCKPIT_INTENT_CLIMATE_OFF = 2;
  COCKPIT_INTENT_SEAT_HEATING_ON = 3;
  COCKPIT_INTENT_SEAT_HEATING_OFF = 4;
  COCKPIT_INTENT_LEFT_FRONT_WINDOW_OPEN = 5;
  COCKPIT_INTENT_LEFT_FRONT_WINDOW_CLOSE = 6;
  COCKPIT_INTENT_MUSIC = 7;
}

enum AnswerRoute {
  ANSWER_ROUTE_UNSPECIFIED = 0;
  ANSWER_ROUTE_RAG_ONLY = 1;
  ANSWER_ROUTE_LLM_ONLY = 2;
  ANSWER_ROUTE_HYBRID = 3;
}

// 历史示例知识库的检索结果；不是实际车辆手册或车控指令。
message RagDocument {
  uint32 id = 1;
  string section = 2;
  string subsection = 3;
  string text = 4;
  float similarity = 5;
}

message RagNoMatch {}

message RagResult {
  string request_message_id = 1;
  oneof outcome {
    RagDocument match = 2;
    RagNoMatch no_match = 3;
  }
}

message TextOutput {
  string request_message_id = 1;
  CockpitIntent intent = 2;
  string text = 3;
  MusicCommand music_command = 4;
  AnswerRoute answer_route = 5;
}
